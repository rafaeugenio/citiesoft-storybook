revisor: Revisor independente de tabela, árvore e contêiner
componente: Card, Table, TreeTable e DataView, segunda captura
veredito: REPROVADO
veredito_anti_slop: VOLTA PARA REFINO

resumo_curto: >-
  Os quatro achados da primeira captura foram fechados, e conferi os quatro sob
  sabotagem, sem aceitar a palavra do produtor. A correção da colisão zebra
  contra seleção é a melhor decisão técnica das duas rodadas. O que reprova é
  uma coisa só, e cabe numa tecla: entrou um travessão em texto que o Storybook
  publica, em TreeTable.stories.tsx:253, e TXT-001 é PROIBIDO sem exceção. Não
  havia nenhum no recorte quando revisei da primeira vez, então é novo e é
  atribuível. Corrigido esse caractere, o veredito vira APROVADO no estado de
  hoje.

gate_tecnico:

  lint: 'oxlint, zero erro. Apenas avisos preexistentes, nenhum novo.'
  testes: >-
    Recorte no tema claro (Table, TreeTable, Card, DataView): 44 de 44, 4
    arquivos, exit 0.
    Recorte no tema escuro: 100% verde.
    Consumidores no escuro (.storybook/pages e .storybook/templates): 19 falhas
    em 3 arquivos, e o conjunto de seletores de violação é IDÊNTICO ao da
    primeira captura: .citie-filtro-chip__valor (11),
    .citie-chart__legenda-valor (8) e um .citie-button--text no Dashboard.
    Zero violação citando table, tr, td, treetable, card ou dataview. Dívida

achados:
  - id: 6B-01
    severidade: MAIOR
    id_anti_slop: regra de marca Citiesoft (logo por contexto de fundo)
    onde: ".storybook/templates/Acesso/Acesso.tsx:71"
    o_que: >
      O painel do formulário fixa `/marca/LogoHorizontal3.svg`, que é a versão
      para fundo claro. No tema escuro o painel fica em `background-surface`
      (#1a1a1d) e a assinatura, cujo texto é #373737, mede 1,46:1 contra o
      fundo. A marca some da tela de entrada do sistema.
    evidencia: >
      Medido nas duas execuções (claro e escuro) e visível nas seis capturas
      `.gauntlet/capturas-lote6b/acesso-*--dark--1366.png` já entregues. O
      AppShell resolve o mesmo problema uma pasta ao lado, com a prop
      `fundoDaBarra` (AppShell.tsx:287), e o Acesso não ganhou equivalente.
    alternativa: >
      Trocar o logotipo pelo tema, como o AppShell faz, ou expor uma prop de
      fundo no Acesso. Fechar com uma story de guarda que afirme o `src` por
      tema, como `Marca.stories.tsx:66` já faz nas fundações.
  - id: 6B-02
    severidade: MAIOR
    onde: >
      Listagem e ConsultaDeProcessos a 375, mais qualquer tabela com coluna de
      ações
    o_que: >
      A 375 a página inteira rola no eixo horizontal para dentro de área vazia:
      717px de área de rolagem contra 375 de viewport na Listagem, 1032 contra
      375 na Consulta. `window.scrollTo(300, 0)` desloca a página de fato, e a
      captura mostra o conteúdo cortado à esquerda com o resto em branco.
    evidencia: >
      Causa isolada por eliminação: o `<span class="citie-visualmente-oculto">`
      com o texto "Ações" dentro de `th.citie-table__celula--acoes` é
      `position: absolute` sem ancestral posicionado, então resolve contra o
      bloco inicial e pousa em x=716 na Listagem e x=1031 na Consulta, fora do
      alcance do `overflow-x: auto` do `citie-table-wrapper`. Esconder só os
      elementos dessa classe devolve o documento a 375. Reproduz em
      `Table > Controle · ações por linha` (873) e `Table > Composição ·
      listagem em cartão` (683), então a origem é do Lote 5, não deste.
    por_que_conta_aqui: >
      As stories responsivas de 375 deste lote passam verdes sem afirmar nada
      sobre a largura do documento, e a documentação escrita neste lote diz o
      contrário do medido: ConsultaDeProcessos.stories.tsx:746 afirma que "a
      tabela rola no eixo horizontal em vez de estourar a tela".
    alternativa: >
      Dar `position: relative` à célula de ações (ou ao `citie-table-wrapper`)
      para prender o rótulo oculto ao contêiner que rola, e acrescentar às
      stories de 375 a asserção de que `documentElement.scrollWidth` é igual à
      largura da viewport.
  - id: 6B-03
    severidade: MENOR
    onde: "src/components/primitives/Field/Field.tsx:80"
    o_que: >
      O modificador `citie-field--rotulo-oculto` é escrito no wrapper e não tem
      nenhuma regra de CSS no repositório. Classe morta que sugere um
      comportamento que não existe.
    alternativa: Remover o modificador, ou dar a ele a regra que justifica existir.
  - id: 6B-04
    severidade: MENOR
    id_anti_slop: TXT-002
    onde: >
      Formulario.stories.tsx:194, ConsultaDeProcessos.stories.tsx:327 e :746
    o_que: >
      Três negações paralelas em texto escrito neste lote: "rota própria em vez
      de drawer", 'nunca oferece "Limpar filtros", e sim a criação' e "em vez
      de estourar a tela". O briefing veta a figura em código, comentário,
      story e doc.
    alternativa: >
      Afirmar direto: "Formulário extenso em rota própria", "o vazio de
      primeiro uso oferece a criação", "a tabela rola no eixo horizontal".
  - id: 6B-05
    severidade: MENOR
    onde: "coluna Situação da Listagem e da Consulta"
    o_que: >
      O kit descreve "badge outline para status" e a implementação entrega
      etiqueta preenchida: fundo rgb(255,251,235), borda `0px none`, texto
      rgb(180,83,9) em 11px. O contraste passa (5,79:1), a anatomia diverge, e
      o handoff não registra a divergência entre as que ficaram fora.
    alternativa: >
      Alinhar ao kit, ou registrar a divergência como decisão com o motivo,
      como o handoff faz com os outros seis itens.
  - id: 6B-06
    severidade: MENOR
    onde: "src/components/organisms/Sidebar/Sidebar.stories.tsx:164"
    o_que: >
      `Sidebar · fixa (shell)` está entre as 35 falhas do escuro porque a story
      afirma o literal rgb(239,245,255) para o item ativo. O shell em si está
      certo: medi rgb(32,40,56) no escuro, que é o `sidebar-accent` do tema.
      É o teste que fixa cor de um tema só.
    escopo: Dívida do Lote 4, fora deste lote. Vale rotear ao Kafka.
  - id: 6B-07
    severidade: POLIMENTO
    onde: ".storybook/templates/Formulario/Formulario.tsx:306"
    o_que: >
      No formulário longo o `h1` fica visualmente oculto e o `main` não recebe
      `aria-labelledby`, então o marco principal fica sem nome acessível. A
      Listagem e o Acesso apontam o `aria-labelledby` para o próprio título.
    alternativa: Repetir aqui o padrão que os outros dois templates já usam.
  - id: 6B-08
    severidade: POLIMENTO
    onde: "src/components/organisms/Widget/KpiFaixa.tsx:60"
    o_que: >
      A região viva da KpiFaixa só é guardada pela página. Removendo o
      `role="status"` do componente, as seis stories da própria KpiFaixa
      seguiram verdes e só o PainelDeTFD reprovou.
    alternativa: Uma asserção da região viva na story do componente.
  - id: 6B-09
    severidade: POLIMENTO
    onde: "src/tokens/tokens.css:760"
    o_que: >
      O bloco `/* Lote 6b */` entrou no commit e69bc69, do Lote 6a, então
      `git show d7bf4ad -- src/tokens/tokens.css` não devolve nada e a revisão
      cega do lote pelo diff não enxerga os sete tokens novos.
    alternativa: Fechar o commit do lote com os tokens que ele criou.

o_que_me_surpreendeu:
  - >
    A story `Anatomia` fixa 52 / 257 / 30 / 32 contra o token e contra o
    literal ao mesmo tempo, então editar o token não faz o teste mentir. Foi
    exatamente a sabotagem que rodei, e ela reprovou.
  - >
    A barra sobre o azul da marca leva todo o texto para
    `sidebar-primary-foreground` e o handoff registra que `brand-contrast`
    mediria 3,0:1 sobre #4d8bfc. Medi 5,63:1 na story de tema escuro: a troca
    foi decidida e documentada, não descoberta por acaso.
  - >
    A dívida do escuro foi rastreada até a causa real, a especificidade de
    `[data-colunas]` vencendo a regra de 900px e colapsando a grade em duas
    colunas a 375, em vez de sobrar no Chart. Confirmei a superfície do gráfico
    em rgb(26,26,29) a 375 e zero falha de escuro em Dashboard e PainelDeTFD.
  - >
    As quatro sabotagens reprovaram, e a do `rotuloOculto` reprovou em dois
    lugares independentes, o componente e o template que o consome.

o_que_faltou_para_surpreender:
  - >
    A tela nova do lote entrega a assinatura da casa a 1,46:1 no tema escuro,
    com a solução pronta uma pasta ao lado. O handoff declara auditoria "em
    captura nos dois temas em 1366 e 375" e fecha anti-slop como PASSOU, e a
    falha está em seis das capturas entregues. É a verificação, mais do que o
    desenho, que segurou a nota.
  - >
    As stories responsivas de 375 medem o que cabe dentro do cartão e nada
    sobre a largura do documento, então a página inteira pode rolar 342px de
    lado com o gate verde.

nota_anti_slop: >
  Rota: produto B2G, fonte `docs/figma-ui-kit.md`. Código limpo no que a
  política cobra: zero hex fora de comentário de medição nos quatro CSS do
  lote, zero travessão, hover do item de seção em `--citie-accent` e não em
  cinza neutro (COR-012 respeitada). O veredito fica em VOLTA PARA REFINO por
  6B-01, que quebra regra de marca da casa, e por 6B-04, que quebra a regra de
  texto do briefing. Nenhum dos dois pede rediscussão de desenho: os dois se
  fecham em uma rodada curta.

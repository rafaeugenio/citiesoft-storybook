medicoes_rodada_2:
  ciclo_de_tab:
    - componente: AlertDialog
      resultado: 'Cancelar → Tab → Confirmar → Tab → Cancelar → Shift+Tab → Confirmar, medido'
    - componente: ConfirmDialog
      resultado: 'mesmo ciclo, medido'
    - componente: 'Dialog e Drawer'
      resultado: 'sem regressão, 100% nas duas suítes depois da mudança no hook compartilhado'
  gates_isolados_no_worktree_e69bc69:
    tsc: 'falso positivo por drift de ambiente, ver achado rebaixado acima'
    claro_7_arquivos: '35/35 (4 do lote + Dialog, Drawer, ConfirmDialog)'
    escuro_7_arquivos: '35/35'
medicoes_rodada_3:
  tsc_no_repositorio_principal: '1 erro, alheio (Table.stories.tsx:290, Lote 5), zero em ToggleGroup.stories.tsx'
  testes_no_repositorio_principal_4_arquivos_do_lote:
    claro: '26/26'
    escuro: '26/26'
o_que_me_surpreendeu:
  - >
    A prisão de foco deixou de ser afirmada e passou a ser provada: um
    hook, useDialogModal, ganhou o ciclo de Tab uma única vez e os quatro
    consumidores (Dialog, ConfirmDialog, Drawer, AlertDialog) herdaram a
    correção sem tocar em cada um, medido com Tab real e sabotagem própria
    do listener nas duas pontas do ciclo (último elemento e primeiro
    elemento).
  - >
    A duplicação de lógica do dialog nativo foi resolvida pela raiz: em vez
    de copiar o efeito de showModal/close e o listener de cancel para o
    AlertDialog, o componente passou a compor sobre o hook compartilhado,
    o que também fechou o achado MENOR do comentário que afirmava sem
    provar.
o_que_faltou_para_surpreender: []
enquadramento_cliente: >
  O gate de conformidade e-MAG 3.1 mais WCAG 2.2 AA deste lote está
  fechado. A falha de navegação por teclado em diálogo modal, que afetava
  AlertDialog e também o ConfirmDialog já publicado, está corrigida e
  provada por teste automatizado num único ponto compartilhado, que também
  beneficia Dialog e Drawer. Command e ToggleGroup atendem teclado, ARIA e
  contraste medidos nos dois temas. Aprovado para o handoff.

sabotagens_confirmadas_rodada_2:
  - id: d
    descricao: >
      Comentado addEventListener('keydown', aoTeclar) dentro de
      useDialogModal (Overlay.tsx), no worktree limpo do commit e69bc69. As
      stories CicloDeTab de AlertDialog e ConfirmDialog reprovaram, 2 de 8

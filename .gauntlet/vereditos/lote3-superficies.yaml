revisor: Loid, Especialista UI/UX, revisor cego do Lote 3
lote: >-
  Lote 3, superfícies e feedback (Card, Panel, Fieldset, Overlay, ConfirmPopup,
  Tooltip, HoverCard, Feedback, EmptyState, Skeleton, SkeletonFormulario,
  SkeletonLista, SkeletonParagrafo) e o bloco Lote 3 de tokens.css
artefato_avaliado: >-
  Branch revisao, sem commit. Diff lido antes do handoff, conforme o briefing.
  Medições em worktree próprio (/Users/rafaeleugenio/dev/citiesoft-storybook-revisao-lote3,
  --detach em HEAD, diff aplicado por git apply, node_modules por hardlink),
  build estático privado em $CLAUDE_JOB_DIR/tmp/static-lote3, scripts de medição
  em .gauntlet/medir-lote3.mjs e medir-lote3b.mjs do worktree (Playwright,
  getComputedStyle nos dois temas).
status: FINAL, rodada 2 (reverificação dos achados fechados em 2026-09-02)
veredito: SURPREENDEU
veredito_anti_slop: PASSOU
veredito_rodada_1: 'APROVADO com anti-slop em VOLTA PARA REFINO'

resumo: >-
  A anatomia bate com o kit em todos os pontos medidos, nos dois temas. Os gates
  do lote estão verdes isolados (81 de 81 claro e escuro) e a suíte escura
  inteira não tem falha em nenhum arquivo do lote. Duas sabotagens reprovam como
  devem (popover no Tooltip, portal do HoverCard em modal); a troca de
  shadow-dialog por shadow-raised e a largura do drawer em 400 passam em
  silêncio, e é isso que segura o SURPREENDEU. O anti-slop volta por quatro
  negações paralelas em comentários novos, correção de minutos.

opiniao_parcial_pelo_diff:
  - 'Card: raio 10, borda default, sombra pelo trilho de elevação. Hub com tokens novos 72/36/20/8. Cabeçalho e rodapé sem fio, respiro por custom property por densidade.'
  - 'Dialog: 640 (md), 800 (lg), raio 10, borda 1px, shadow-dialog, fechar de 30 por token. Rodapé de um botão só estica por :has(> :only-child).'
  - 'Drawer: 591 por token, margem 8 e raio 16, título 24. Sem teste de largura.'
  - 'Tooltip: popover e popover-foreground, 12/16, padding 6 por 8, seta por spacing-1-5, raio 10. Corte de 2 linhas migrou para o filho.'
  - 'Message: 12 por 16, gap 16, ícone 16, fundo de superfície com aresta tonal a 30 por cento (25 no escuro).'
  - 'Toast: pilha em escala 0,97 e 0,94 por nth-last-child(of :not(saindo)), ação à direita em altura mini.'
  - 'Feedback.tsx importa Badge.css para trazer o mapa .citie-sev--*: padrão já usado por Avatar, PrazoIndicador e ValorMonetario, e errado nos quatro.'


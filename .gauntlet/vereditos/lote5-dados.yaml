    - "ICO-001: glifos de texto (✓ ⏱ ✕ ↑ ↓ ↕ ▲ ▼ ⚠) trocados por SVG no traço do sistema"
    - "LAY-004: faixa lateral da Timeline mantida com rótulo de estado no nome acessível, exceção declarada"

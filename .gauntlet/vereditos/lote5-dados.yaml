o_que_me_surpreendeu: >
  A composição do véu sobre a seleção medida por pixel bate com o cálculo
  por alfa nos dois temas (#c6d2e4 e #2e4063 contra #2e4064), e o
  re-apontamento da borda de campo dentro da linha em hover, um problema
  que o Lote 0 só tinha medido, agora resolve de fato: 4,51 / 4,57 na
  linha comum e 3,23 / 3,20 na selecionada, medidos com um campo injetado
  na célula. conferirRegua comparando a lista inteira de alturas faz a
  sabotagem b apontar a linha certa.

o_que_faltou_para_surpreender: >
  Escopo limpo. Duas das três sabotagens do briefing passam em silêncio, e
  o item de 32 declarado para Tree e Listbox mede 40. Com esses três
  fechados e a busca alinhada a 36, o lote está a uma rodada de APROVADO.
